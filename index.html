<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9fc">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Rate</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --card: #fff;
      --ink: #0f172a;
      --muted: #475569;
      --line: #e2e8f0;
      --blue: #2563eb;
      --gold: #c5a35a;
      --gold-deep: #9a7b3c;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    }

    main {
      width: 100%;
      max-width: 480px;
      min-width: 0;
      margin: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0;
      padding: clamp(20px, 5vw, 28px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mark {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      display: block;
      border: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.28rem, 4vw, 1.5rem);
      font-weight: 560;
      letter-spacing: -0.035em;
      overflow-wrap: anywhere;
    }

    .lead {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
      overflow-wrap: break-word;
    }

    .stars {
      display: flex;
      gap: 4px;
      margin-top: 18px;
    }

    .star {
      appearance: none;
      border: 0;
      background: transparent;
      color: #cbd5e1;
      flex: 1 1 0;
      width: auto;
      max-width: 52px;
      aspect-ratio: 1;
      height: auto;
      padding: 6px;
      border-radius: 0;
      cursor: pointer;
      line-height: 0;
    }

    .star svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .star path {
      fill: transparent;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linejoin: round;
    }

    .star.on {
      color: var(--gold);
    }

    .star.on path {
      fill: currentColor;
    }

    .star:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      min-height: 1.4em;
      margin-top: 4px;
    }

    .meta {
      margin: 0;
      color: var(--gold-deep);
      font-size: 0.86rem;
      letter-spacing: 0.01em;
    }

    .text-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--blue);
      font: inherit;
      font-size: 0.86rem;
      padding: 4px 0;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .text-btn:hover { color: #1d4ed8; }

    .text-btn:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .review {
      margin-top: 16px;
      padding: 14px 14px 16px;
      border: 1px solid var(--line);
      background: var(--bg);
    }

    .label {
      margin: 0;
      color: var(--gold-deep);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .quote {
      margin: 8px 0 0;
      min-height: 4.8em;
      font-size: 1.05rem;
      line-height: 1.55;
      letter-spacing: 0;
      overflow-wrap: break-word;
    }

    .quote.empty {
      font-size: 1.05rem;
    }

    .quote.generating {
      color: var(--blue);
    }

    .wave {
      display: inline-flex;
      gap: 4px;
      margin-left: 6px;
      height: 1em;
      vertical-align: middle;
    }

    .wave i {
      width: 5px;
      height: 5px;
      margin-top: 0.45em;
      border-radius: 50%;
      background: var(--blue);
      animation: wave 0.9s ease-in-out infinite;
    }

    .wave i:nth-child(2) { animation-delay: 0.14s; }
    .wave i:nth-child(3) { animation-delay: 0.28s; }

    .quote.fresh {
      animation: rise 260ms ease;
    }

    @keyframes wave {
      0%, 70%, 100% { transform: translateY(0); opacity: 0.35; }
      35% { transform: translateY(-6px); opacity: 1; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .quote.fresh,
      .wave i { animation: none; }
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .actions[hidden] { display: none; }

    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 0.92rem;
      width: 100%;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 0;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .btn:hover { background: #f8fafc; }

    .btn.primary:hover { background: #1d4ed8; }

    .btn:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .place-link {
      display: inline-block;
      margin-top: 4px;
      color: var(--blue);
      font-size: 0.86rem;
    }

    .status {
      min-height: 1.3em;
      margin: 12px 0 0;
      color: var(--ink);
      font-size: 0.9rem;
      line-height: 1.4;
    }
  </style>
</head>

    const WORDS = ["", "Poor", "Fair", "Okay", "Good", "Excellent"];
    const TYPES = ["general", "restaurant", "shop", "clinic", "salon"];
    const TYPE_MARK = {
      restaurant: /meal|food|order|dish|eat|restaurant|kitchen|plate|snack|taste|menu/i,
      shop: /shop|buy|bought|purchase|product|item|goods|billing|stock|shelf/i,
      clinic: /clinic|appointment/i,
      salon: /salon|stylist|appointment/i
    };

    function cleanType(value) {
      const key = String(value || "").toLowerCase();
      return TYPES.includes(key) ? key : "general";
    }

    const DEFAULT_PLACE = {
      name: "Abdul Ahad Enterprises",
      fid: "0x399c470720d572c5:0x56417441619742e0",
      maps: "https://maps.app.goo.gl/qi7Ffes7L7ZkK98b9",
      type: "general"
    };

    const stars = Array.from(document.querySelectorAll(".star"));
    const group = document.querySelector(".stars");
    const placeTitle = document.getElementById("place");
    const mapsLink = document.getElementById("maps");
    const meta = document.getElementById("meta");
    const quote = document.getElementById("quote");
    const actions = document.getElementById("actions");
    const clearBtn = document.getElementById("clear");
    const anotherBtn = document.getElementById("another");
    const copyBtn = document.getElementById("copy");
    const googleLink = document.getElementById("google");
    const status = document.getElementById("status");

    let place = DEFAULT_PLACE;
    let rating = 0;
    let hover = 0;
    let choice = { open: 0, detail: 0, close: 0 };
    let generation = 0;
    let generationTimer = 0;

    function placeIdFromFid(fid) {
      const parts = fid.split(":").map((hex) => BigInt(hex));
      const bytes = new Uint8Array(20);
      const view = new DataView(bytes.buffer);
      bytes[0] = 0x0a;
      bytes[1] = 0x12;
      bytes[2] = 0x09;
      view.setBigUint64(3, parts[0], true);
      bytes[11] = 0x11;
      view.setBigUint64(12, parts[1], true);
      let binary = "";
      bytes.forEach((value) => { binary += String.fromCharCode(value); });
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function reviewHref(current) {
      return "https://search.google.com/local/writereview?placeid=" + encodeURIComponent(placeIdFromFid(current.fid));
    }

    function mapsHref(current) {
      if (current.maps && /^https?:/i.test(current.maps)) return current.maps;
      const cid = BigInt(current.fid.split(":")[1]).toString();
      return "https://www.google.com/maps?cid=" + cid;
    }

    function storedType(fid) {
      try {
        const list = JSON.parse(localStorage.getItem("star-owners") || "[]");
        const found = Array.isArray(list) && list.find((item) => item.fid === fid);
        return found ? cleanType(found.type) : "general";
      } catch {
        return "general";
      }
    }

    function pageHref(current) {
      const url = new URL(location.href);
      url.searchParams.set("name", current.name);
      url.searchParams.set("fid", current.fid);
      url.searchParams.set("type", cleanType(current.type));
      if (current.maps) url.searchParams.set("maps", current.maps);
      else url.searchParams.delete("maps");
      return url.toString();
    }

    function readPlace() {
      const params = new URLSearchParams(location.search);
      const name = params.get("name");
      const fid = params.get("fid");
      const maps = params.get("maps");
      if (name && fid && /^0x[0-9a-f]+:0x[0-9a-f]+$/i.test(fid)) {
        const fromUrl = params.get("type");
        return {
          name: name,
          fid: fid,
          maps: maps || "",
          type: fromUrl ? cleanType(fromUrl) : storedType(fid)
        };
      }
      return { ...DEFAULT_PLACE, type: storedType(DEFAULT_PLACE.fid) };
    }

    function rememberOwner(current) {
      const key = "star-owners";
      let list = [];
      try {
        list = JSON.parse(localStorage.getItem(key) || "[]");
      } catch {
        list = [];
      }
      if (!Array.isArray(list)) list = [];
      const existing = list.find((item) => item.fid === current.fid);
      if (existing) {
        existing.name = current.name;
        existing.maps = current.maps || existing.maps || "";
        existing.type = cleanType(current.type);
      } else {
        list.push({
          name: current.name,
          fid: current.fid,
          maps: current.maps || "",
          type: cleanType(current.type),
          added: Date.now()
        });
      }
      localStorage.setItem(key, JSON.stringify(list));
    }

    function setPlace(next) {
      place = { ...next, type: cleanType(next.type) };
      placeTitle.textContent = place.name;
      document.title = place.name;
      mapsLink.href = mapsHref(place);
      googleLink.href = reviewHref(place);
      history.replaceState(null, "", pageHref(place));
      rememberOwner(place);
      if (rating) showLine(false);
    }

    function fill(template) {
      const raw = place.name.trim().replace(/\s+/g, " ");
      return template.replaceAll("{Name}", raw || "This").replaceAll("{name}", raw || "this");
    }

    function reviewBag() {
      const group = PARTS[cleanType(place.type)] || PARTS.general;
      return group[rating];
    }

    function textFor(next) {
      const bag = reviewBag();
      return [
        fill(bag.open[next.open]),
        fill(bag.detail[next.detail]),
        fill(bag.close[next.close])
      ].join(" ");
    }

    function currentLine() {
      if (!rating) return "";
      return textFor(choice);
    }

    function pickSlot(list, avoid) {
      if (list.length < 2) return 0;
      let next = Math.floor(Math.random() * list.length);
      if (next === avoid) next = (next + 1) % list.length;
      return next;
    }

    function sameChoice(left, right) {
      return left.open === right.open && left.detail === right.detail && left.close === right.close;
    }

    function chooseReview(avoid) {
      const bag = reviewBag();
      const mark = TYPE_MARK[cleanType(place.type)];
      let best = null;
      let bestGap = 99;
      for (let attempt = 0; attempt < 60; attempt += 1) {
        const next = {
          open: pickSlot(bag.open, avoid ? avoid.open : -1),
          detail: pickSlot(bag.detail, avoid ? avoid.detail : -1),
          close: pickSlot(bag.close, avoid ? avoid.close : -1)
        };
        if (avoid && sameChoice(next, avoid)) {
          next.close = (next.close + 1) % bag.close.length;
        }
        const text = textFor(next);
        let gap = text.length < 120 ? 120 - text.length : text.length > 146 ? text.length - 146 : 0;
        if (mark && !mark.test(text)) gap += 80;
        if (gap === 0) return next;
        if (!best || gap < bestGap) {
          best = next;
          bestGap = gap;
        }
      }
      return best;
    }

    function paintStars() {
      const shown = hover || rating;
      stars.forEach((star, index) => {
        const value = index + 1;
        star.classList.toggle("on", value <= shown);
        star.setAttribute("aria-checked", String(value === rating));
        star.tabIndex = value === (rating || 1) ? 0 : -1;
      });
    }

    function paintQuote(text, animate) {
      quote.classList.remove("generating");
      quote.removeAttribute("aria-busy");
      quote.textContent = text || "Choose a star to write a review.";
      quote.classList.toggle("empty", !text);
      if (animate && text) {
        quote.classList.remove("fresh");
        void quote.offsetWidth;
        quote.classList.add("fresh");
      }
    }

    function showGenerating() {
      quote.classList.add("generating");
      quote.classList.remove("fresh", "empty");
      quote.setAttribute("aria-busy", "true");
      quote.replaceChildren(document.createTextNode("AI is generating"));
      const wave = document.createElement("span");
      wave.className = "wave";
      wave.setAttribute("aria-hidden", "true");
      for (let dot = 0; dot < 3; dot += 1) wave.append(document.createElement("i"));
      quote.append(wave);
    }

    function showLine(animate) {
      const text = currentLine();
      meta.textContent = rating ? WORDS[rating] + " · " + rating + " / 5" : "";
      actions.hidden = !rating;
      clearBtn.hidden = !rating;
      window.clearTimeout(generationTimer);
      const token = ++generation;
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!animate || !text || reduce) {
        paintQuote(text, animate && !reduce);
        return;
      }
      showGenerating();
      generationTimer = window.setTimeout(() => {
        if (token !== generation) return;
        paintQuote(text, true);
      }, 1000);
    }

    function setRating(value, animate) {
      const changed = value !== rating;
      rating = value;
      if (!value) {
        choice = { open: 0, detail: 0, close: 0 };
        hover = 0;
        showLine(false);
        paintStars();
        stars[0].tabIndex = 0;
        return;
      }
      if (changed) choice = chooseReview(null);
      showLine(animate);
      paintStars();
    }

    stars.forEach((star) => {
      star.addEventListener("click", () => {
        hover = 0;
        setRating(Number(star.dataset.value), true);
      });
    });

    group.addEventListener("pointerover", (event) => {
      if (event.pointerType === "touch") return;
      const star = event.target.closest(".star");
      if (!star) return;
      hover = Number(star.dataset.value);
      paintStars();
    });

    group.addEventListener("pointerleave", () => {
      hover = 0;
      paintStars();
    });

    group.addEventListener("keydown", (event) => {
      const current = rating || 0;
      let next = current;
      if (event.key === "ArrowRight" || event.key === "ArrowUp") next = Math.min(5, (current || 0) + 1);
      else if (event.key === "ArrowLeft" || event.key === "ArrowDown") next = Math.max(1, (current || 1) - 1);
      else if (event.key === "Home") next = 1;
      else if (event.key === "End") next = 5;
      else if (/^[1-5]$/.test(event.key)) next = Number(event.key);
      else return;
      event.preventDefault();
      hover = 0;
      setRating(next, true);
      stars[next - 1].focus();
    });

    clearBtn.addEventListener("click", () => {
      setRating(0, false);
      status.textContent = "";
      stars[0].focus();
    });

    anotherBtn.addEventListener("click", () => {
      if (!rating) return;
      choice = chooseReview(choice);
      showLine(true);
    });

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).catch(() => copyWithField(text));
      }
      copyWithField(text);
      return Promise.resolve();
    }

    function copyWithField(text) {
      const area = document.createElement("textarea");
      area.value = text;
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }

    function flashCopy() {
      const previous = copyBtn.textContent;
      copyBtn.textContent = "Copied";
      window.setTimeout(() => {
        copyBtn.textContent = previous;
      }, 1200);
    }

    copyBtn.addEventListener("click", () => {
      const text = currentLine();
      if (!text) return;
      copyText(text).then(() => {
        flashCopy();
        status.textContent = "Copied. Paste it into the Google review box.";
      });
    });

    googleLink.addEventListener("click", (event) => {
      const text = currentLine();
      if (!text) {
        event.preventDefault();
        status.textContent = "Choose a star first.";
        return;
      }
      copyText(text).then(() => {
        flashCopy();
        status.textContent = "Copied. Paste it into the Google review box.";
      });
    });

    setPlace(readPlace());
    paintStars();
  </script>
</body>
</html>
